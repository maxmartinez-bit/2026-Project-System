<!DOCTYPE html>
<html>
<head>
<title>Staff Dashboard</title>
<link rel="icon" type="image/png" href="../image/logo.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    background:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e')
    no-repeat center center/cover;
    min-height:100vh;

    /* FIXED */
    overflow-y:auto;

    color:white;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:-1;
}

/* SIDEBAR */
.sidebar{
    width:260px;
    height:100vh;

    position:sticky;
    top:0;

    background:rgba(0,0,0,0.45);
    backdrop-filter:blur(12px);

    padding:25px 18px;

    overflow-y:auto;

    border-right:1px solid rgba(255,255,255,0.08);
}

.sidebar h2{
    font-size:38px;
    margin-bottom:25px;
}

.sidebar p{
    margin-bottom:25px;
    font-size:15px;
    font-weight:bold;
    color:#f1f1f1;
}

.sidebar a{
    display:block;
    text-decoration:none;
    color:white;
    padding:14px 16px;
    margin-bottom:10px;
    border-radius:14px;
    transition:0.3s;
    font-size:16px;
    font-weight:500;
}

.sidebar a:hover{
    background:rgba(255,255,255,0.15);
}

.sidebar .active{
    background:rgba(255,255,255,0.18);
}

.dark-btn{
    width:100%;
    margin-top:20px;
    border:none;
    padding:14px;
    border-radius:14px;
    background:#00bcd4;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.dark-btn:hover{
    background:#0097a7;
}

/* MAIN */
.main{
    flex:1;
    padding:25px;

    /* FIXED */
    overflow-y:auto;
}

/* DASHBOARD */
.dashboard{
    display:block;
}

.page-title{
    font-size:42px;
    margin-bottom:25px;
    font-weight:700;
}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    border-radius:24px;
    padding:30px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h2{
    font-size:45px;
    margin-bottom:10px;
}

.card p{
    font-size:18px;
}

/* CHART */
.chart-card{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    border-radius:24px;
    padding:25px;
    margin-bottom:25px;
}

/* NOTIFICATIONS */
.notif-card{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    border-radius:24px;
    padding:25px;
    margin-bottom:30px;
}

.notif-card h3{
    margin-bottom:15px;
    font-size:24px;
}

.notif-card ul{
    padding-left:20px;
}

.notif-card li{
    margin-bottom:10px;
}

/* IFRAME */
iframe{
    width:100%;
    min-height:95vh;
    border:none;
    border-radius:24px;
    display:none;
    background:transparent;
}

/* DARK MODE */
.dark{
    background:#0f172a;
}

.dark .sidebar{
    background:#020617;
}

.dark .card,
.dark .chart-card,
.dark .notif-card{
    background:rgba(255,255,255,0.06);
}

/* SCROLLBAR */
::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#00bcd4;
    border-radius:10px;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <h2>🏖️ Resort</h2>

    <p id="roleText"></p>

    <a href="#" onclick="showDashboard()" class="active">
        Dashboard
    </a>

    <a href="#" onclick="loadPage('pages/guests.html')">
        Guests
    </a>

    <a href="#" onclick="loadPage('pages/reservations.html')">
        Reservations
    </a>

    <a href="#" onclick="loadPage('pages/reservation-services.html')">
        Add Services
    </a>

    <a href="#" onclick="loadPage('pages/check-in.html')">
        Check-In
    </a>

    <a href="#" onclick="loadPage('pages/payments.html')">
        Payments
    </a>

    <a href="#" onclick="loadPage('pages/check-out.html')">
        Check-Out
    </a>

    <a href="#" onclick="logout()">
        Logout
    </a>

    <button class="dark-btn" onclick="toggleDark()">
        🌙 Dark Mode
    </button>

</div>

<!-- MAIN -->
<div class="main">

    <!-- DASHBOARD -->
    <div id="dashboardContent" class="dashboard">

        <h1 class="page-title">
            👨‍💼 Staff Dashboard
        </h1>

        <!-- STATS -->
        <div class="cards">

            <div class="card">
                <h2 id="totalReservations">0</h2>
                <p>Reservations</p>
            </div>

            <div class="card">
                <h2 id="totalGuests">0</h2>
                <p>Guests</p>
            </div>

            <div class="card">
                <h2 id="totalPayments">0</h2>
                <p>Payments</p>
            </div>

        </div>

        <!-- CHART -->
        <div class="chart-card">

            <canvas id="bookingChart"></canvas>

        </div>

        <!-- NOTIFICATIONS -->
        <div class="notif-card">

            <h3>Notifications</h3>

            <ul id="notifList"></ul>

        </div>

    </div>

    <!-- DYNAMIC PAGES -->
    <iframe id="contentFrame"></iframe>

</div>

<script>

const API =
    "http://localhost:5158/api";

// AUTH
const role =
    localStorage.getItem("role");

const username =
    localStorage.getItem("username");

if(!role){

    window.location.href =
        "login.html";
}

// SHOW ROLE
document.getElementById("roleText")
.innerText =
`👨‍💼 Staff (${username})`;

// LOGOUT
function logout(){

    localStorage.clear();

    window.location.href =
        "login.html";
}

// DARK MODE
function toggleDark(){

    document.body
    .classList.toggle("dark");
}

// LOAD PAGE
function loadPage(page){

    document.getElementById(
        "dashboardContent"
    ).style.display = "none";

    const frame =
        document.getElementById(
            "contentFrame"
        );

    frame.style.display = "block";

    frame.src = page;
}

// SHOW DASHBOARD
function showDashboard(){

    document.getElementById(
        "contentFrame"
    ).style.display = "none";

    document.getElementById(
        "dashboardContent"
    ).style.display = "block";
}

// LOAD STATS
async function loadStats(){

    try{

        const reservations =
        await (
            await fetch(`${API}/Reservations`)
        ).json();

        const guests =
        await (
            await fetch(`${API}/Guests`)
        ).json();

        const payments =
        await (
            await fetch(`${API}/Payments`)
        ).json();

        document.getElementById(
            "totalReservations"
        ).innerText =
            reservations.length;

        document.getElementById(
            "totalGuests"
        ).innerText =
            guests.length;

        document.getElementById(
            "totalPayments"
        ).innerText =
            payments.length;

    }catch(err){

        console.error(err);
    }
}

// CHART
function loadChart(){

    new Chart(
        document.getElementById(
            "bookingChart"
        ),
    {
        type:'bar',

        data:{

            labels:[
                'Mon',
                'Tue',
                'Wed',
                'Thu',
                'Fri'
            ],

            datasets:[{

                label:'Reservations',

                data:[
                    5,
                    10,
                    7,
                    12,
                    9
                ],

                backgroundColor:
                'rgba(0,188,212,0.5)'
            }]
        }
    });
}

// NOTIFICATIONS
function addNotification(msg){

    const li =
        document.createElement("li");

    li.innerText = msg;

    document.getElementById(
        "notifList"
    ).appendChild(li);
}

// INIT
loadStats();

loadChart();

addNotification(
    "Welcome Staff!"
);

addNotification(
    "Monitor guest reservations carefully."
);

addNotification(
    "Always confirm payments before checkout."
);

</script>

</body>
</html>
