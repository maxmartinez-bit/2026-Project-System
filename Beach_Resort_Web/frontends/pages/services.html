<!DOCTYPE html>
<html>
<head>
<title>Manage Services</title>
<link rel="stylesheet" href="../../css/style.css">

<style>

.page-title{
    font-size:32px;
    font-weight:700;
    margin-bottom:25px;
}

/* CONTENT */
.content{
    width:100%;
    padding:20px;
    color:white;
}

/* CARD */
.card{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    padding:20px;
    border-radius:20px;
    margin-bottom:25px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h2{
    margin-bottom:20px;
}

/* FORM */
.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-grid textarea{
    grid-column:span 2;
}

.form-grid select,
.form-grid button{
    grid-column:span 2;
}

/* INPUTS */
input,
select,
textarea{
    width:100%;
    height:55px;
    padding:0 16px;
    border:none;
    border-radius:12px;
    outline:none;
    background:rgba(255,255,255,0.92);
    font-size:15px;
    box-sizing:border-box;
}

textarea{
    height:110px;
    padding:16px;
    resize:none;
}

/* BUTTONS */
button{
    height:55px;
    border:none;
    border-radius:12px;
    background:#00bcd4;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0097a7;
}

.btn-delete{
    background:#ff5252;
    height:auto;
    padding:10px 18px;
}

.btn-delete:hover{
    background:#d32f2f;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th{
    background:rgba(255,255,255,0.15);
    padding:15px;
    text-align:left;
}

td{
    padding:15px;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

/* BADGES */
.badge{
    padding:7px 14px;
    border-radius:20px;
    color:white;
    font-size:13px;
    font-weight:bold;
}

.food{
    background:#00bcd4;
}

.rental{
    background:#8e24aa;
}

.activity{
    background:#43a047;
}

.fee{
    background:#fb8c00;
}

.available{
    background:#00c853;
}

.unavailable{
    background:#ff5252;
}

</style>
</head>

<body>

<div class="content">

<h1 class="page-title">🛎️ Manage Services</h1>

<!-- ADD SERVICE -->
<div class="card">

    <h2>Add Service</h2>

    <div class="form-grid">

        <input id="name" placeholder="Service Name">

        <input id="price" type="number" placeholder="Price">

        <!-- ✅ DESCRIPTION -->
        <textarea id="description"
        placeholder="Service Description"></textarea>

        <select id="category">
            <option value="Activity">Activity</option>
            <option value="Rental">Rental</option>
            <option value="Fee">Entrance Fee</option>
            <option value="Food">Food</option>
        </select>

        <button onclick="add()">Add Service</button>

    </div>

</div>

<!-- SERVICE LIST -->
<div class="card">

    <h2>Service List</h2>

    <table>

        <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Category</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="table"></tbody>

    </table>

</div>

</div>

<script>

const API = "http://localhost:5158/api";

// LOAD SERVICES
async function load(){

    try{

        const res = await fetch(`${API}/Services`);
        const data = await res.json();

        table.innerHTML = data.map(s => `

            <tr>

                <td>${s.serviceName}</td>

                <td>${s.description || "No Description"}</td>

                <td>₱ ${parseFloat(s.price).toLocaleString()}</td>

                <td>
                    <span class="badge ${s.category.toLowerCase()}">
                        ${s.category}
                    </span>
                </td>

                <td>
                    <span class="badge ${s.status === 'Available'
                        ? 'available'
                        : 'unavailable'}">

                        ${s.status || 'Available'}

                    </span>
                </td>

                <td>
                    <button class="btn-delete"
                    onclick="del(${s.serviceID || s.id})">
                        Delete
                    </button>
                </td>

            </tr>

        `).join("");

    }catch(err){

        console.error(err);
        alert("Failed to load services");

    }
}

// ADD SERVICE
async function add(){

    const name =
        document.getElementById("name");

    const price =
        document.getElementById("price");

    const description =
        document.getElementById("description");

    const category =
        document.getElementById("category");

    if(!name.value || !price.value){

        alert("Please fill all fields");
        return;
    }

    try{

        const res = await fetch(`${API}/Services`,{

            method:"POST",

            headers:{
                'Content-Type':'application/json'
            },

            body:JSON.stringify({

                serviceName:name.value,

                description:description.value,

                price:parseFloat(price.value),

                category:category.value,

                status:"Available"

            })
        });

        if(!res.ok){

            const errText = await res.text();

            console.error(errText);

            alert("Failed to add service");

            return;
        }

        // CLEAR
        name.value = "";
        price.value = "";
        description.value = "";
        category.value = "Activity";

        alert("Service added successfully");

        load();

    }catch(err){

        console.error(err);

    }
}

// DELETE
async function del(id){

    if(!confirm("Delete this service?")) return;

    try{

        await fetch(`${API}/Services/${id}`,{
            method:"DELETE"
        });

        alert("Service deleted");

        load();

    }catch(err){

        console.error(err);

    }
}

// INIT
load();

</script>

</body>
</html>
