<!DOCTYPE html>
<html>
<head>

<title>Staff Management</title>

<link rel="stylesheet" href="../../css/style.css">

<style>

.page-title{
    font-size:32px;
    font-weight:700;
    margin-bottom:25px;
}

/* FORM */
.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    align-items:center;
}

.form-grid button,
.form-grid select{
    grid-column:span 2;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

table th{
    background:rgba(255,255,255,0.1);
    padding:14px;
    text-align:left;
}

table td{
    padding:14px;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

/* BUTTONS */
.btn-delete{
    background:#ff5252;
}

.btn-delete:hover{
    background:#d32f2f;
}

/* ROLE BADGE */
.badge{
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.admin{
    background:#ff9800;
    color:white;
}

.staff{
    background:#00bcd4;
    color:white;
}

/* INPUTS */
input,
select{
    width:100%;
    height:55px;
    padding:12px 15px;
    border:none;
    border-radius:10px;
    outline:none;
    background:rgba(255,255,255,0.9);
    font-size:15px;
    box-sizing:border-box;
}

/* FIX INPUT ALIGNMENT */
.form-grid input{
    width:100%;
    height:55px;
    padding:12px 15px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
    box-sizing:border-box;
}

/* CARD EFFECT */
.card{
    transition:0.3s;
}

.card:hover{
    transform:translateY(-3px);
}

</style>

</head>

<body>

<!-- MAIN -->
<div class="main">

<h1 class="page-title">
    Staff Management
</h1>

<!-- ADD STAFF -->
<div class="card">

    <h2>Add Staff/User</h2>

    <div class="form-grid">

        <input
        type="text"
        id="username"
        placeholder="Username">

        <input
        type="password"
        id="password"
        placeholder="Password">

        <select id="role">

            <option value="Staff">
                Staff
            </option>

            <option value="Admin">
                Admin
            </option>

        </select>

        <button onclick="addUser()">
            Add User
        </button>

    </div>

</div>

<!-- USER TABLE -->
<div class="card">

    <h2>User List</h2>

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Role</th>
                <th>Created</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody id="table"></tbody>

    </table>

</div>

</div>

<script>

const API = "http://localhost:5158/api";

/* SECURITY */
const currentRole =
localStorage.getItem("role");

if(!currentRole){
    window.location.href = "../login.html";
}

/* ADMIN ONLY */
if(currentRole.toLowerCase() !== "admin"){
    alert("Access denied");
    window.location.href =
    "../staff-dashboard.html";
}

/* LOAD USERS */
async function loadUsers(){

    try{

        const res =
        await fetch(`${API}/User`);

        const data =
        await res.json();

        table.innerHTML =
        data.map(u => `

        <tr>

            <td>${u.id}</td>

            <td>${u.username}</td>

            <td>
                <span class="badge
                ${u.role.toLowerCase()}">

                    ${u.role}

                </span>
            </td>

            <td>
                ${new Date(u.createdAt)
                .toLocaleString()}
            </td>

            <td>

                <button
                class="btn-delete"
                onclick="deleteUser(${u.id})">

                    Delete

                </button>

            </td>

        </tr>

        `).join("");

    }
    catch(err){

        console.error(err);

        alert("Failed to load users");

    }

}

/* ADD USER */
async function addUser(){

    const username =
    document.getElementById("username");

    const password =
    document.getElementById("password");

    const role =
    document.getElementById("role");

    /* VALIDATION */
    if(
        !username.value ||
        !password.value
    ){
        alert("Fill all fields");
        return;
    }

    try{

        const res =
        await fetch(`${API}/User/register`,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                username:username.value,

                password:password.value,

                role:role.value

            })

        });

        const text = await res.text();

        if(!res.ok){
            alert(text);
            return;
        }

        alert("User added successfully");

        username.value = "";
        password.value = "";
        role.value = "Staff";

        loadUsers();

    }
    catch(err){

        console.error(err);

        alert("Failed to add user");

    }

}

/* DELETE USER */
async function deleteUser(id){

    if(!confirm("Delete this user?"))
        return;

    try{

        const res =
        await fetch(`${API}/User/${id}`,{

            method:"DELETE"

        });

        if(!res.ok){

            alert("Failed to delete");
            return;

        }

        loadUsers();

    }
    catch(err){

        console.error(err);

        alert("Delete failed");

    }

}

/* INIT */
loadUsers();

</script>

</body>
</html>
