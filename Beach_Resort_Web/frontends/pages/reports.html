<!DOCTYPE html>
<html>
<head>
<title>Reports</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    color:white;
}

/* PAGE */
.page-title{
    font-size:40px;
    font-weight:bold;
    margin-bottom:25px;
}

/* GRID */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-bottom:30px;
}

/* CARD */
.card{
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(8px);
    border-radius:20px;
    padding:30px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h2{
    font-size:40px;
    margin-bottom:10px;
}

.card p{
    font-size:18px;
    color:#ddd;
}

/* CHART */
.chart-card{
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(8px);
    border-radius:20px;
    padding:25px;
    margin-bottom:30px;
}

/* TABLE */
.table-card{
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(8px);
    border-radius:20px;
    padding:25px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

table th{
    background:rgba(255,255,255,0.1);
    padding:15px;
    text-align:left;
}

table td{
    padding:15px;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.amount{
    color:#00e676;
    font-weight:bold;
}

</style>

</head>

<body>

<h1 class="page-title">📊 Reports Overview</h1>

<!-- CARDS -->
<div class="cards">

    <div class="card">
        <h2 id="totalReservations">0</h2>
        <p>Total Reservations</p>
    </div>

    <div class="card">
        <h2 id="totalGuests">0</h2>
        <p>Total Guests</p>
    </div>

    <div class="card">
        <h2 id="totalRevenue">₱0</h2>
        <p>Total Revenue</p>
    </div>

    <div class="card">
        <h2 id="availableRooms">0</h2>
        <p>Available Rooms</p>
    </div>

</div>

<!-- CHART -->
<div class="chart-card">

    <h2 style="margin-bottom:20px;">
        Reservation Analytics
    </h2>

    <canvas id="reportChart"></canvas>

</div>

<!-- RECENT PAYMENTS -->
<div class="table-card">

    <h2>Recent Payments</h2>

    <table>

        <thead>
            <tr>
                <th>Reservation</th>
                <th>Amount</th>
                <th>Date</th>
            </tr>
        </thead>

        <tbody id="paymentTable"></tbody>

    </table>

</div>

<script>

const API = "http://localhost:5158/api";

/* LOAD REPORTS */
async function loadReports(){

    try{

        // FETCH
        const reservations =
        await (await fetch(`${API}/Reservations`)).json();

        const guests =
        await (await fetch(`${API}/Guests`)).json();

        const payments =
        await (await fetch(`${API}/Payments`)).json();

        const rooms =
        await (await fetch(`${API}/Rooms`)).json();

        // TOTALS
        document.getElementById("totalReservations")
        .innerText = reservations.length;

        document.getElementById("totalGuests")
        .innerText = guests.length;

        // REVENUE
        let revenue = 0;

        payments.forEach(p => {
            revenue += p.amount;
        });

        document.getElementById("totalRevenue")
        .innerText = "₱" + revenue.toLocaleString();

        // AVAILABLE ROOMS
        const available =
        rooms.filter(r => r.status === "Available");

        document.getElementById("availableRooms")
        .innerText = available.length;

        // PAYMENT TABLE
        const table =
        document.getElementById("paymentTable");

        table.innerHTML = payments
        .slice()
        .reverse()
        .map(p => `

        <tr>

            <td>
                Reservation #${p.reservationID}
            </td>

            <td class="amount">
                ₱${p.amount}
            </td>

            <td>
                ${new Date(p.paymentDate)
                    .toLocaleString()}
            </td>

        </tr>

        `).join("");

        // CHART
        loadChart(reservations, payments);

    }
    catch(err){

        console.error(err);

        alert("Failed to load reports");

    }

}

/* CHART */
function loadChart(reservations, payments){

    new Chart(document.getElementById("reportChart"), {

        type:'bar',

        data:{

            labels:[
                'Reservations',
                'Payments'
            ],

            datasets:[{

                label:'System Reports',

                data:[
                    reservations.length,
                    payments.length
                ],

                backgroundColor:[
                    'rgba(0,188,212,0.5)',
                    'rgba(0,230,118,0.5)'
                ]

            }]

        },

        options:{

            responsive:true,

            plugins:{
                legend:{
                    labels:{
                        color:'white'
                    }
                }
            },

            scales:{

                x:{
                    ticks:{
                        color:'white'
                    }
                },

                y:{
                    ticks:{
                        color:'white'
                    }
                }

            }

        }

    });

}

/* INIT */
loadReports();

</script>

</body>
</html>
