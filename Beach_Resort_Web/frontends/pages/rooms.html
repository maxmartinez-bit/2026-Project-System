<!DOCTYPE html>
<html>
<head>
<title>Rooms</title>
<link rel="stylesheet" href="../../css/style.css">

<style>

.page-title{
    font-size:32px;
    font-weight:700;
    margin-bottom:25px;
}

/* FORM GRID */
.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    width:100%;
}

/* INPUTS */
.form-grid input,
.form-grid select{
    width:100%;
    height:55px;
    padding:0 18px;
    border:none;
    border-radius:12px;
    outline:none;
    font-size:16px;
    box-sizing:border-box;
    background:rgba(255,255,255,0.92);
}

/* FULL WIDTH */
.form-grid select,
.form-grid button{
    grid-column:span 2;
}

/* BUTTON */
button{
    height:55px;
    border:none;
    border-radius:12px;
    background:#12c6df;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0ea5b9;
}

/* DELETE BUTTON */
.btn-delete{
    background:#ff5252;
    padding:10px 18px;
    border-radius:10px;
    border:none;
    color:white;
    cursor:pointer;
}

.btn-delete:hover{
    background:#d32f2f;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

table th{
    background:rgba(255,255,255,0.1);
    padding:16px;
    text-align:left;
    font-size:16px;
}

table td{
    padding:16px;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

/* STATUS BADGE */
.badge{
    padding:8px 16px;
    border-radius:30px;
    font-size:13px;
    font-weight:bold;
    color:white;
}

.available{
    background:#00c853;
}

.unavailable{
    background:#ff5252;
}

/* CARD EFFECT */
.card{
    transition:0.3s;
}

.card:hover{
    transform:translateY(-3px);
}

</style>
</head>

<body>

<div class="main">

<h1 class="page-title">🏨 Room Management</h1>

<!-- ADD ROOM -->
<div class="card">

    <h2>Add Room</h2>

    <div class="form-grid">

        <input id="name"
               placeholder="Room Number"
               required>

        <input id="type"
               placeholder="Room Type"
               required>

        <input id="price"
               type="number"
               step="0.01"
               placeholder="Price"
               required>

        <select id="availability">
            <option value="Available">Available</option>
            <option value="Occupied">Occupied</option>
        </select>

        <button onclick="add()">Add Room</button>

    </div>

</div>

<!-- ROOM LIST -->
<div class="card">

    <h2>Room List</h2>

    <table>

        <thead>
            <tr>
                <th>Room</th>
                <th>Type</th>
                <th>Price</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="table"></tbody>

    </table>

</div>

</div>

<script>

const API = "http://localhost:5158/api";

const name = document.getElementById("name");
const type = document.getElementById("type");
const price = document.getElementById("price");
const availability = document.getElementById("availability");
const table = document.getElementById("table");

/* LOAD ROOMS */
async function load(){

    try{

        const res = await fetch(`${API}/Rooms`);
        const data = await res.json();

        table.innerHTML = data.map(r => `

        <tr>

            <td>${r.roomNumber}</td>

            <td>${r.roomType || "N/A"}</td>

            <td>₱ ${parseFloat(r.price).toLocaleString()}</td>

            <td>
                <span class="badge ${r.status === 'Available'
                    ? 'available'
                    : 'unavailable'}">

                    ${r.status}

                </span>
            </td>

            <td>
                <button class="btn-delete"
                        onclick="del(${r.roomID})">
                        Delete
                </button>
            </td>

        </tr>

        `).join("");

    }
    catch(err){

        console.error(err);
        alert("Failed to load rooms");

    }
}

/* ADD ROOM */
async function add(){

    if(!name.value || !type.value || !price.value){

        alert("Fill all fields");
        return;

    }

    try{

        const res = await fetch(`${API}/Rooms`,{

            method:"POST",

            headers:{
                'Content-Type':'application/json'
            },

            body:JSON.stringify({

                roomNumber:name.value,
                roomType:type.value,
                price:parseFloat(price.value),
                status:availability.value

            })

        });

        if(!res.ok){

            alert("Failed to add room");
            return;

        }

        name.value = "";
        type.value = "";
        price.value = "";
        availability.value = "Available";

        load();

    }
    catch(err){

        console.error(err);
        alert("Error adding room");

    }
}

/* DELETE ROOM */
async function del(id){

    if(!confirm("Delete room?")) return;

    try{

        await fetch(`${API}/Rooms/${id}`,{
            method:"DELETE"
        });

        load();

    }
    catch(err){

        console.error(err);
        alert("Delete failed");

    }
}

load();

</script>

</body>
</html>
